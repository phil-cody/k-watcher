<!doctype html>
<html lang="ru">
<head>

  <title>Задания на Kwork — список проектов</title>

  <script>
    window.__captchaConfig = { siteKey: "public-site-key", enabled: false };
  </script>
</head>
<body>

    </div>
    <!-- Скрытый служебный блок проверки, который показывается только по требованию -->
    <div class="captcha-container" style="display:none" id="captcha-container"></div>

</html>
